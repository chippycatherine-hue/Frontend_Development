<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Science Lab</title>
    <link rel="stylesheet 
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>
    body {background-color: #f8f9fa; font-family: Arial, sans-serif;}
    .jumbotron {background-color: #e9ecef; border-left: 5px solid #007bff;}
    .jumbotron h1 {color: #007bff;}
    .section-title {color: #343a40; margin-top: 20px; margin-bottom: 10px;}
    p {font-weight: 500; margin-bottom: 15px;}
</style>
</head>
<body>
    
    <!--TOPIC-1: Jumbotron-->
    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1>My Science Lab</h1>
            <p class="lead">Welcome to the lab! Here are the experiments running, the discoveries made, and how far each research project has come.</p>
            <!--TOPIC-2: BUTTONS-->
            <button class="btn btn-primary">Chemistry</button>
            <button class="btn btn-success">Biology</button>
            <button class="btn btn-warning">Physics</button>   
            <button class="btn btn-danger">Astronomy</button>
        </div>
    </div>

    <div class="container">
       <!--TOPIC-3: BADGES-->
       <h2 class="section-title">Experiments Completed<span class="badge badge-primary">4</span></h2>
       <p>Chemistry: <span class="badge badge-secondary">7 experiments</span></p>
         <p>Biology: <span class="badge badge-success">5 experiments</span></p> 
        <p>Physics: <span class="badge badge-warning">3 experiments</span></p>
        <p>Astronomy: <span class="badge badge-danger">2 experiments</span></p>

</body>
</html>
