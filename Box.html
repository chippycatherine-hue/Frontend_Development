<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Animal Fact File</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;

    .fact-file{
        background-color: #fff;
        color: #333;
        border: 1px solid #ccc;
        padding: 20px;
        margin: 20px auto;
        width: 80%;
    }

    .animal-name {
        font-size: 24px;
        color: #007BFF;
    }

    .details {
       color: #555;
    }

    .cool-fact {
        font-style: italic;
        color: #28a745;
    }

    </style>
</head>
<body>
    
    <div class="fact-file">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class="details">Type: Big Cat</p>
        <p class="details">Lives in: Mountain ranges of Central Asia</p>
        <p class="details">Diet: Deer, Goat and Wild Sheep</p>
        <p class="cool-fact">Cool Fact: Can leap up to 15 meters in one jump!</p>
    </div>
</body>
</html>
