<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Phone Contact</title>
    <link rel="stylesheet"
     href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
     <style>
        body {background-color: #f8f9fa;}
        h1 {color: #343a40;}
        .card-label{font-size: 1.2rem;color: #495057;text-transform: uppercase;}
        pre {font-size: 0.9rem;color:#343a40;}
     </style>
</head>
<body class="py-4">

    <div class="container">

        <h1 class="mb-4">My Phone Contact</h1>
        <p class="text muted mb-4">
            Introduction to objects in Javascript - grade 4-6
        </p>

        <!--Contact card-->
        <div class="card shadow-sm mb-3" style="max-width:400px;">
        <div class="card-body">
        <h5 class="card-title" style="color:#FF5A43;">Contact Details</h5>
        <ul class="list-group list-group-flush">
        <li class="list-group-item">
        <span class="card-label d-block">Name</span>
        <strong id="name">—</strong>
    </li>

<li class="list-group-item">
<span class="card-label d-block">Phone</span>
<strong id="phone">—</strong>
</li>
<li class="list-group-item">

<span class="card-label d-block">School</span>

<strong id="school">—</strong>

</li>
<li class="list-group-item">
<span class="card-label d-block">City</span>
<strong id="city">—</strong>
</li>
</ul>
</div>
</div>

<!-- Code Box -->
<div class="card shadow-sm" style="max-width:400px;">
<div class="card-body">
<h6 style="color:#FF5A43;">JavaScript Object Used</h6>
<pre id="codeDisplay"
class="bg-light p-3 rounded border mb-0"></pre>
</div>
</div><!--/Container-->

<script>

    // Step-1 - Create a contact object
    var mycontent = {
        name: "John Doe",
        phone: "+1 234 567 890",
        school: "Greenwood High",
        city: "New York"
    };

  // Step-2 Dot notation
  var nameEl = document.getElementById("name");
  var phoneEl = document.getElementById("phone");
  nameEl.textContent = mycontent.name;
  phoneEl.textContent = mycontent.phone;

  // Step-3 Bracket notation
    var schoolEl = document.getElementById("school");
    var cityEl = document.getElementById("city");
    schoolEl.textContent = mycontent["school"];
    cityEl.textContent = mycontent["city"];
    
</script>
    
</body>
</html>
