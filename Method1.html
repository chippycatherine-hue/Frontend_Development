<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript String Methods</h2>
        <p>Basic Methods</p>
        <script>
            var str = "Amazing";
            document.write(str.toUpperCase());
            document.write("<br>");
            document.write(str.toLowerCase());
            document.write("<br>");
            document.write(str.charAt(0));
            document.write("<br>");

            // Test Method -> returns true or false
            var str1 = "I learnt about methods";
            var patt = new RegExp("about");
            ver res = patt.test(str1);
            document.write(res);
            
        </script>
    </body>
</html>
